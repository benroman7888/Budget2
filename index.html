<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f3f5"><title>14 Day Budget</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f2;color:#20252b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;background:#fff;min-height:100vh}
header{padding:16px;border-bottom:1px solid #d5d9de;position:sticky;top:0;background:#fff;z-index:3}h1{font-size:20px;margin:0}.period{font-size:12px;color:#69717a;margin-top:2px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.box{background:#f5f6f7;border:1px solid #e0e3e6;border-radius:9px;padding:7px}.label{font-size:9px;text-transform:uppercase;color:#707780;font-weight:700}.value{font-size:15px;font-weight:800;margin-top:2px}.safe{background:#edf6ef}
.wrap{overflow:auto}.table{min-width:640px}.th,.day{display:grid;grid-template-columns:84px 75px 265px 80px 105px}.th{background:#e9ecef;color:#59616a;font-size:10px;text-transform:uppercase;font-weight:800}.th div,.day div{padding:8px 7px;border-right:1px solid #e0e3e6}.day{border-bottom:1px solid #e1e4e8;font-size:12px;min-height:54px;cursor:pointer}.day:hover{background:#fafbfc}.today{background:#fffbed}.date{font-weight:800}.in{color:#197743;font-weight:750}.out{color:#ad3838}.bal{font-weight:850}.neg{background:#ffeded;color:#a22f2f}.muted{color:#9aa1a8}.item{line-height:1.35}
footer{padding:14px 16px 26px;border-top:1px solid #e0e3e6}.buttons{display:flex;gap:8px}.buttons button{flex:1;padding:11px;border-radius:10px;border:1px solid #ccd2d8;background:#fff;font-weight:750}.primary{background:#20252b!important;color:white;border-color:#20252b!important}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(760px,100%);background:white;border-radius:18px 18px 0 0;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 4px;font-size:19px}.hint{font-size:12px;color:#747c84;margin-bottom:12px}.entry{display:grid;grid-template-columns:1fr 100px 34px;gap:7px;margin:7px 0}.entry input{min-width:0}.input,select{padding:10px;border:1px solid #cfd5db;border-radius:9px;font-size:15px;width:100%;background:white}.remove{border:1px solid #ddd;background:#fff;border-radius:9px;color:#b22}.section{font-size:12px;font-weight:800;color:#606970;text-transform:uppercase;margin-top:14px}.sheet-actions{display:flex;gap:8px;margin-top:14px}.sheet-actions button{flex:1;padding:11px;border-radius:10px;border:1px solid #ccd2d8;font-weight:750}.sheet-actions .primary{background:#20252b;color:#fff}.plus{margin-top:7px;padding:8px;border:1px dashed #b9c0c7;border-radius:9px;background:#fafbfc;width:100%}
</style></head><body><main class="app">
<header><h1>14 Day Budget</h1><div id="period" class="period"></div>
<div class="summary"><div class="box"><div class="label">Starting</div><div id="start" class="value"></div></div><div class="box"><div class="label">Income</div><div id="inc" class="value"></div></div><div class="box"><div class="label">Committed</div><div id="out" class="value"></div></div><div class="box safe"><div class="label">Available</div><div id="safe" class="value"></div></div></div></header>
<div class="wrap"><div class="table"><div class="th"><div>Date</div><div>In</div><div>Out</div><div>Spend</div><div>Balance</div></div><div id="rows"></div></div></div>
<footer><div class="buttons"><button onclick="openAdd()">＋ Add transaction</button><button class="primary" onclick="resetData()">Reset sample</button></div></footer></main>
<div id="modal" class="modal"><div class="sheet"><h2 id="modalTitle"></h2><div class="hint">Tap a value to edit it. Changes recalculate the balance automatically.</div>
<div class="section">Income</div><div id="incomeList"></div><button class="plus" onclick="addEntry('income')">＋ Add income</button>
<div class="section">Payments</div><div id="paymentList"></div><button class="plus" onclick="addEntry('payment')">＋ Add payment</button>
<div class="section">Spending</div><div id="spendList"></div><button class="plus" onclick="addEntry('spend')">＋ Add spending</button>
<div class="sheet-actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveDay()">Save changes</button></div></div></div>
<script>
const seed={"startingBalance": 31.47, "transactions": [{"id": "2026-09-21-4", "date": "2026-09-21", "type": "payment", "description": "Zil", "amount": 9.09}, {"id": "2026-09-21-spend", "date": "2026-09-21", "type": "spend", "description": "Spending", "amount": 20.0}, {"id": "2026-09-22-income", "date": "2026-09-22", "type": "income", "description": "Income", "amount": 380.0}, {"id": "2026-09-22-4", "date": "2026-09-22", "type": "payment", "description": "Mbt", "amount": 10.63}, {"id": "2026-09-22-6", "date": "2026-09-22", "type": "payment", "description": "Zil", "amount": 12.51}, {"id": "2026-09-22-8", "date": "2026-09-22", "type": "payment", "description": "BIP", "amount": 50.0}, {"id": "2026-09-23-4", "date": "2026-09-23", "type": "payment", "description": "EE", "amount": 44.89}, {"id": "2026-09-24-income", "date": "2026-09-24", "type": "income", "description": "Income", "amount": 350.0}, {"id": "2026-09-24-4", "date": "2026-09-24", "type": "payment", "description": "Quid", "amount": 8.48}, {"id": "2026-09-24-6", "date": "2026-09-24", "type": "payment", "description": "Zil", "amount": 32.98}, {"id": "2026-09-25-income", "date": "2026-09-25", "type": "income", "description": "Income", "amount": 302.0}, {"id": "2026-09-25-4", "date": "2026-09-25", "type": "payment", "description": "CU", "amount": 60.0}, {"id": "2026-09-25-6", "date": "2026-09-25", "type": "payment", "description": "Zab", "amount": 52.0}, {"id": "2026-09-29-4", "date": "2026-09-29", "type": "payment", "description": "Mbt", "amount": 10.63}, {"id": "2026-09-29-6", "date": "2026-09-29", "type": "payment", "description": "Rent", "amount": 148.05}, {"id": "2026-10-01-income", "date": "2026-10-01", "type": "income", "description": "Income", "amount": 250.0}, {"id": "2026-10-01-4", "date": "2026-10-01", "type": "payment", "description": "DVLA", "amount": 18.81}, {"id": "2026-10-01-6", "date": "2026-10-01", "type": "payment", "description": "Quid", "amount": 8.48}, {"id": "2026-10-01-8", "date": "2026-10-01", "type": "payment", "description": "YT", "amount": 12.99}, {"id": "2026-10-02-income", "date": "2026-10-02", "type": "income", "description": "Income", "amount": 200.0}, {"id": "2026-10-02-4", "date": "2026-10-02", "type": "payment", "description": "CU", "amount": 60.0}, {"id": "2026-10-02-6", "date": "2026-10-02", "type": "payment", "description": "Goo", "amount": 1.59}, {"id": "2026-10-02-8", "date": "2026-10-02", "type": "payment", "description": "Zil", "amount": 12.37}, {"id": "2026-10-05-4", "date": "2026-10-05", "type": "payment", "description": "Zil", "amount": 9.09}, {"id": "2026-10-06-income", "date": "2026-10-06", "type": "income", "description": "Income", "amount": 385.0}, {"id": "2026-10-06-4", "date": "2026-10-06", "type": "payment", "description": "Zil", "amount": 12.51}, {"id": "2026-10-07-4", "date": "2026-10-07", "type": "payment", "description": "AA", "amount": 5.71}, {"id": "2026-10-07-6", "date": "2026-10-07", "type": "payment", "description": "Spot", "amount": 12.99}, {"id": "2026-10-08-income", "date": "2026-10-08", "type": "income", "description": "Income", "amount": 300.0}, {"id": "2026-10-08-4", "date": "2026-10-08", "type": "payment", "description": "Zil", "amount": 32.98}, {"id": "2026-10-09-income", "date": "2026-10-09", "type": "income", "description": "Income", "amount": 200.0}, {"id": "2026-10-09-4", "date": "2026-10-09", "type": "payment", "description": "CU", "amount": 60.0}, {"id": "2026-10-15-income", "date": "2026-10-15", "type": "income", "description": "Income", "amount": 300.0}, {"id": "2026-10-16-income", "date": "2026-10-16", "type": "income", "description": "Income", "amount": 200.0}, {"id": "2026-10-16-4", "date": "2026-10-16", "type": "payment", "description": "CU", "amount": 60.0}, {"id": "2026-10-16-6", "date": "2026-10-16", "type": "payment", "description": "Zil", "amount": 12.37}, {"id": "2026-10-22-income", "date": "2026-10-22", "type": "income", "description": "Income", "amount": 300.0}, {"id": "2026-10-22-4", "date": "2026-10-22", "type": "payment", "description": "Zil", "amount": 33.0}, {"id": "2026-10-23-income", "date": "2026-10-23", "type": "income", "description": "Income", "amount": 580.0}, {"id": "2026-10-29-income", "date": "2026-10-29", "type": "income", "description": "Income", "amount": 300.0}, {"id": "2026-10-29-4", "date": "2026-10-29", "type": "payment", "description": "Rent", "amount": 148.05}, {"id": "2026-10-30-income", "date": "2026-10-30", "type": "income", "description": "Income", "amount": 200.0}, {"id": "2026-10-30-4", "date": "2026-10-30", "type": "payment", "description": "Zil", "amount": 12.38}]};let data=JSON.parse(localStorage.getItem('budget14v3')||JSON.stringify(seed));let editingDate=null;
const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n);
const iso=d=>d.toISOString().slice(0,10);function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 const now=new Date();now.setHours(0,0,0,0);const dates=Array.from({length:14},(_,i)=>addDays(now,i)),from=iso(dates[0]),to=iso(dates[13]);
 const prior=data.transactions.filter(t=>t.date<from).sort((a,b)=>a.date.localeCompare(b.date));let bal=data.startingBalance;
 prior.forEach(t=>bal+=t.type==='income'?t.amount:-t.amount);
 const groups={};dates.forEach(d=>groups[iso(d)]=[]);data.transactions.filter(t=>t.date>=from&&t.date<=to).forEach(t=>groups[t.date].push(t));
 let ti=0,toPay=0,ts=0,rows='';
 dates.forEach((d,i)=>{const key=iso(d),arr=groups[key];let di=0,dp=0,ds=0;
 arr.forEach(t=>{if(t.type==='income'){di+=t.amount;ti+=t.amount}else if(t.type==='payment'){dp+=t.amount;toPay+=t.amount}else{ds+=t.amount;ts+=t.amount}});
 bal+=di-dp-ds;const outs=arr.filter(t=>t.type==='payment').map(t=>`<div class="item out">${esc(t.description)} ${money(t.amount)}</div>`).join('')||'<span class="muted">—</span>';
 rows+=`<div class="day ${i===0?'today':''}" onclick="openDay('${key}')"><div class="date">${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</div><div class="in">${di?money(di):'—'}</div><div>${outs}</div><div class="out">${ds?money(ds):'—'}</div><div class="bal ${bal<0?'neg':''}">${money(bal)}</div></div>`});
 document.getElementById('rows').innerHTML=rows;document.getElementById('period').textContent=`${dates[0].toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${dates[13].toLocaleDateString('en-GB',{day:'numeric',month:'short'})}`;
 document.getElementById('start').textContent=money(data.startingBalance);document.getElementById('inc').textContent=money(ti);document.getElementById('out').textContent=money(toPay+ts);document.getElementById('safe').textContent=money(data.startingBalance+ti-toPay-ts)
}
function openDay(date){editingDate=date;document.getElementById('modalTitle').textContent=new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});fillEditor();document.getElementById('modal').classList.add('open')}
function openAdd(){const d=prompt('Enter date as YYYY-MM-DD',iso(new Date()));if(d)openDay(d)}
function row(t){return `<div class="entry" data-id="${t.id}"><input class="input desc" value="${esc(t.description)}"><input class="input amt" type="number" step="0.01" min="0" value="${t.amount}"><button class="remove" onclick="this.parentElement.remove()">×</button></div>`}
function fillEditor(){const a=data.transactions.filter(t=>t.date===editingDate);document.getElementById('incomeList').innerHTML=a.filter(t=>t.type==='income').map(row).join('');document.getElementById('paymentList').innerHTML=a.filter(t=>t.type==='payment').map(row).join('');document.getElementById('spendList').innerHTML=a.filter(t=>t.type==='spend').map(row).join('')}
function addEntry(type){const id='new-'+Date.now()+Math.random();const html=`<div class="entry" data-id="${id}" data-new="1" data-type="${type}"><input class="input desc" placeholder="${type==='income'?'Income':type==='payment'?'Payment':'Spending'}"><input class="input amt" type="number" step="0.01" min="0" placeholder="0.00"><button class="remove" onclick="this.parentElement.remove()">×</button></div>`;document.getElementById(type==='income'?'incomeList':type==='payment'?'paymentList':'spendList').insertAdjacentHTML('beforeend',html)}
function saveDay(){const old=data.transactions.filter(t=>t.date===editingDate);const ids=new Set();document.querySelectorAll('.entry').forEach((el,i)=>{const id=el.dataset.id;let t=old.find(x=>x.id===id);const type=t?t.type:el.dataset.type;if(!t)t={id:'t-'+Date.now()+'-'+i,date:editingDate,type};t.description=el.querySelector('.desc').value.trim()||'Payment';t.amount=Number(el.querySelector('.amt').value)||0;ids.add(id);if(t.amount>0){if(old.includes(t)){const idx=data.transactions.indexOf(old.find(x=>x.id===id));data.transactions[idx]=t}else data.transactions.push(t)}});
 data.transactions=data.transactions.filter(t=>t.date!==editingDate||document.querySelector(`.entry[data-id="${t.id}"]`));localStorage.setItem('budget14v3',JSON.stringify(data));closeModal();render()}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function resetData(){if(confirm('Reset to the original spreadsheet sample data?')){localStorage.removeItem('budget14v3');location.reload()}}
render();
</script></body></html>
